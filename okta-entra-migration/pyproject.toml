[project]
name = "okta-entra-migration"
version = "0.2.0"
description = "Plan and carry out an Okta to Microsoft Entra ID migration from a JSON inventory"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "lib", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE"]
ignore = ["E402"]
