[project]
name = "okta-admin-scripts"
version = "0.2.0"
description = "Okta admin scripts in Python and PowerShell"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
oauth = ["pyjwt[crypto]>=2.8"]
dev = ["pytest>=8", "ruff>=0.6", "pyjwt[crypto]>=2.8"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S", "I"]
# S311: random jitter on retries is not a security use. S101: asserts in tests.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
