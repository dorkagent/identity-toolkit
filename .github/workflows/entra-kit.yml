name: entra-kit

on:
  push:
    paths:
      - "okta-entra-migration/**"
      - ".github/workflows/entra-kit.yml"
  pull_request:
    paths:
      - "okta-entra-migration/**"
      - ".github/workflows/entra-kit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: okta-entra-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Offline smoke run
        run: |
          python export_inventory.py -o "$RUNNER_TEMP/inv.json" -q
          python import_users.py --inventory "$RUNNER_TEMP/inv.json" -q
          python mirror_groups.py --inventory "$RUNNER_TEMP/inv.json" -q
          python migrate_apps.py --inventory "$RUNNER_TEMP/inv.json" -q > /dev/null
          python inventory_service_accounts.py --inventory "$RUNNER_TEMP/inv.json" -q > /dev/null
          python cutover_tracker.py --inventory "$RUNNER_TEMP/inv.json" --report > /dev/null
